<script type="text/markdown" id="src"># GAIA `main` — Comprehensive Code Review

**Target:** `amd/gaia` `main` @ `211f08c5` ("Use the workspace root lockfile for the example Electron app (#3301)"), the commit after "Release v0.23.1 (#3054)". `src/gaia/version.py` = `0.23.1`, `LEMONADE_VERSION` = `11.8.1`. No `v0.23.1` tag exists yet; PyPI/npm latest = 0.23.0.
**Review dates:** 2026-09-02 → 2026-09-04 (first pass 2026-09-02/04, verification pass 2026-09-04). **Platform:** Windows 11, Python 3.13 venv (`.[dev,ui]`), Go 1.26, Node 22.

## 0. How to read this report

Findings are ranked 🔴 Critical → 🟡 Important → 🟢 Minor per `REVIEW.md`: 🔴 = security, data loss, breaking API, or a bug that fires in normal use; 🟡 = a real bug on an edge path, missing tests for real logic, a convention violation, or a doc that contradicts code; 🟢 = minor. Lint/format/copyright were skipped per `REVIEW.md`. 🔒 marks security findings.

**Verification standard.** Nothing in Sections 2–4 is speculation: each item was confirmed against source at this commit by a first-pass reviewer and then independently re-derived by a second-pass verifier; 37 of the critical/important findings were additionally reproduced by executing a probe (marked *probe*), four more against live systems or the installed binary. Claims that could not be confirmed are in Appendix D, labelled as hypotheses. Finding IDs (`C1…`, `I1…`) are stable references for this report; Appendix E maps them to the IDs used in the raw and verification files.

## 0.1 Scope and method

Eight parallel first-pass reviewers each owned one dimension, read their scope fully (large files line-by-line), ran the relevant unit tests where the dimension had any (docs and the Workers/website used live probes and static checks instead), and checked `gh issue list` for existing tracking. A coordinator de-duplicated across reviewers and resolved discrepancies. Four second-pass verifiers then re-derived every finding from source, re-ran probes, and an editorial critic recounted every number and read the highest-risk files the first pass had skipped — adding 15 findings and correcting ~40 claims (Appendix A). Raw per-dimension reports (≈3,600 lines, with quoted evidence) and verification logs (≈5,000 lines) are in `.review/` next to this file.

## 1. Executive summary

GAIA's security primitives are individually good and collectively unenforced. Constant-time compares, atomic 0600 secret files, an SQLite authorizer allow-list for LLM SQL, a real SSRF validator with DNS-rebind protection, HMAC-signed RAG caches, Ed25519 skill signing, a confirmation gate that MCP and REST paths cannot bypass, OIDC publishing behind a single approval — each exists, and each is skipped at some call site that forgot to invoke it. That is the shape of almost every finding here: primitives that exist but are not wired everywhere, boundaries enforced by convention rather than by construction, tests that prove a call happened rather than that it was valid, and a Windows platform no automated unit lane exercises. (Appendix C lists ~150 things that were checked and found sound.)

This review confirmed **41 critical and 98 important findings (consolidated IDs; the raw reports hold 34 🔴 / 153 🟡 / 82 🟢 entries before merging) plus ≈120 distinct minor items**. 37 of the critical/important findings were reproduced by executing a probe, four more against live systems or the installed binary. Every one was then independently re-verified by a second pass: two sub-claims were refuted (a CORS wildcard that does not exist; a shell operator that is in fact blocked), three findings were overstated and re-ranked, ~40 citation, count and wording corrections were applied, and six new criticals were found in files the first pass had listed as unread. Ten criticals carry or name an open issue (#124, #630, #1128, #1344, #1460, #2474, #2768, #2803, #2951, #3316); none is fully tracked.

### Ten themes to fix first (≈25 changes)

1. **The release is blocked three ways** (C39): tagging `v0.23.1` fails two of `publish.yml`'s own validators, the release gate (`email-eval`) is red on Anthropic billing, and two other workflows race the tag before any approval. The notes also tell users to run a command that does not exist. Fix all three, then tag — and add the validators at PR time so it cannot recur.
2. **The per-agent connector grant model is dead** (C1, C17, I14): tool bodies run on a thread that drops the agent identity and the connectors layer treats "no identity" as "skip the check"; the ledger it would check can be set to any scope by any local caller; the Tavily key is handed out ungated regardless. One `copy_context().run`, a fail-closed default, and a scope ceiling — landed together.
3. **Three PowerShell injection sinks and a shell allowlist that is not a boundary** (C2, C3, C4, C5): `notify_desktop` interpolates model text; indexing a PPTX interpolates its *filename* (no model involved); unspaced `&`, `-e`, aliases and `.NET`/WMI calls run through `cmd.exe` as "read-only" — behind one confirmation click, or none under auto-approve or an "always" grant; a granted `gh` skill can print the user's PAT.
4. **`allowed_paths` is bypassed by fifteen tools across six families, is silently widened to `$HOME` by attaching a document, and has no sensitive-file denylist on reads** (C7, C8, I13) — while three docs call it the production security boundary and one unit test pins the bypass as intended. Reads of `~/.ssh/id_rsa` and writes to `~/.bashrc` both pass today.
5. **Local HTTP surfaces are drive-by exploitable from any web page**: 41 CSRF-able Agent UI routes — one body-less POST opened a real public tunnel during verification (C11); a wildcard trust of every `*.ngrok-free.app` origin that defeats the CSRF guard entirely (C12); the MCP bridge's `ACAO: *` (C13); the base `AgentServer` and OpenAI API with no auth (C10). The tunnel token, when it applies, is a read token for the entire home directory (I34).
6. **Esc does not stop the shipped agent** (C30): the TUI kills only the PyInstaller bootloader; the real process finishes the cancelled tool call, eats the next message, and a respawn silently reverts `/bypass off` (C31). Verified against the installed binary.
7. **`gaia uninstall --purge` can delete `~/Documents`** when `GAIA_HOME` points at home (C23); `gaia kill --port` / `gaia api stop` kill unrelated processes (C24); `replace_function` deletes neighbouring code and the target's decorators (C25); `download_file` overwrites user files with attacker-named content (C26); `gaia skill remove .` wipes `~/.gaia/skills` incl. the signing keys (C22); a chat turn can mint `system`/`profile`/`permission` memory rows that lead every future system prompt (C16).
8. **Shipped features that are broken outright**: every `/v1/chat/completions` request to `gaia api` raises `TypeError` (C27 — the test uses a `MagicMock` agent); web fetch fails on 9 of 11 tested sites incl. `example.com`, `github.com` and `amd-gaia.ai` because the IP-pinning adapter sends no SNI (C32 — a documented "residual limitation", now measured); memory consolidation never completes for sessions over 20 turns, re-stores duplicates every boot, and the raw turns are then pruned (C28); the renderer deletes ```` ```shell ```` blocks and JSON examples from answers (C29); `gaia talk` never pauses the mic while it speaks and ignores `--model` (C33, C34 — #124 open since v0.13); a chat turn can hang forever on a prompt printed to the server's terminal (C37); `import gaia` dies in any process without a resolvable home dir (C38).
9. **Electron and the C++ framework**: one click on an LLM-rendered link can launch a local binary (C14, verified resolution); "Always allow" is a permanent hidden client-side bypass (C15); a missing method crash-exits the app during agent crash loops (C35); "Open in GAIA" fails on cold start (C36); the C++ MCP client hands server arguments to `/bin/sh -c` unescaped (C19).
10. **The quality gates are aspirational**: no CI lane runs `tests/unit` on Windows and ≈640 tests (overlapping tallies across the sampled trees) are red there (C41); the release build's own test step ends in `|| echo skipped` (C40); fork PRs run unapproved on persistent lab runners (C20) and the publish path uses mutable action tags (C21); the eval gate has never produced a scorecard and 9 of 12 categories have no baseline (I78); ≈43 test files run in no workflow (I75).

### Structural themes (what the findings have in common)

- **Enforcement by convention, not construction.** Sandbox, SSRF guard, CSRF header (defined four times), caller auth, keyring refusal, grant check, category validation — each exists and each is skipped somewhere because a call site forgot it. The fix pattern is the same every time: enforce at registration/middleware/store level, not per call site (§8 items 1–4).
- **Windows is untested.** ≈640 unit tests (overlapping tallies) are red on a clean Windows checkout for five environmental reasons (C41, I74); the eval serial guard is a no-op there (I76). Several Windows-specific bugs in this report (C4, C24, C38, NTFS ACL gaps, cp1252/CRLF breakage) would have been caught by one `windows-latest` job.
- **Tests that pin bugs as contracts.** At least eleven tests assert the buggy behaviour (§5), and ≈43 test files run in no workflow at all.
- **Duplicate implementations drift.** Four copies of the CSRF guard; three `read_file`s; two web fetchers (one without the SSRF guard); two voice pipelines (the correct one unused); three schedulers; two uninstallers with different `~/.gaia` contracts; three renderer JSON cleaners; five TUI scrubbers; two C++ error decoders; three near-identical release workflows.
- **Silent fallbacks persist** despite the CLAUDE.md rule: ≈95 bare `pass/return/continue` handlers in `src+hub` (densest in `ui/routers/memory.py` and `agents/base/system_context.py`), plus the release build's `pytest … || echo "skipped"` (C40), `gaia init` failures reported as success in the Electron installer (I68), VLM errors returned as document text (I20), integrity failures reported as ordinary staleness (I53), an index-query failure that silently falls back to a filesystem walk (I36).
- **Docs and process drift faster than code.** The roadmap is five months stale; six plans say "0%" for shipped features; CLAUDE.md advertises a cancelled rename and omits five packages; the CLI reference documents 21 `gaia tui` invocations that do not exist; the npm email package links to a tag that was never created; the security-model page has superseded itself (§7).

### What is in good shape

The daemon/custody/relay layer, the connectors OAuth/PKCE/keyring path, the SQL authorizer, the hub installer's archive handling, the embedded Lemonade runtime, the RAG thread-safety and PDF-state work (#746/#784), the email agent's autonomy safety envelope, the TUI control API, `openai_server`'s CORS configuration, and the Electron process-isolation settings are all careful, well-tested, and matched their documentation — see Appendix C before spending review time there again.

---

## 2. Critical findings (🔴)

Grouped by the kind of harm. "Source" names the raw report (`01`…`08`, `04b`, `crit`) holding the full evidence; 🔒 marks security findings. IDs were renumbered after the verification pass — Appendix E maps them to the IDs used in the raw and verification files.

### 2.1 Security boundaries that do not hold

**C1. Tool bodies drop the agent-identity contextvar, so the per-agent connector grant check is silently bypassed** 🔒 — `src/gaia/agents/base/agent.py:3157-3186` (`_call_tool_bounded`) spawns a bare `threading.Thread`; Python threads start with an empty context, so inside any tool `current_agent_id()` is `None`, and `src/gaia/connectors/api.py:187-197` / `handler.py:152-155` treat `None` as "skip the per-agent grant check". Every tool executed through the agent loop since #1591 has run with the #915 grant control dead. Today's in-tree callers pass `agent_id=` explicitly (email agent, daemon forward), but the documented public pattern for skills (`docs/sdk/infrastructure/connectors.mdx:257-262`) is the ungated one. *Probe:* main thread sees `gaia/probe`, tool body sees `agent_id: None`. Related but independent: the Tavily key (`web/tavily.py:125,145` → `connectors/handler.py:137-168`) passes neither `agent_id` nor `required_scopes`, so it stays ungated **even after this fix** (`test_handler.py:161 test_no_agent_id_skips_grant_check` locks it in) — see I14. **Fix:** take `ctx = contextvars.copy_context()` in the *caller* thread and run `Thread(target=lambda: ctx.run(_target))` (copying inside `_target` is a no-op); make `_authorize_access` (`api.py:167`) and `get_credential` (`handler.py:133`) fail closed when identity is absent while an agent runtime is active; update `connectors.mdx:257-262`, which teaches the pattern fail-closed will reject; add a test that executes a tool via `_execute_tool` and reads `current_agent_id()`. Must land together with C17 (the ledger it checks can otherwise be set to arbitrary scopes). Confidence High. Tracked: none. Source 01, 03, crit.

**C2. `notify_desktop` builds a PowerShell command by string-interpolating model-controlled text → command injection on Windows** 🔒 — `hub/agents/chat/python/gaia_agent_chat/agent.py:1643-1701`. `plyer` is not a declared dependency (`grep plyer setup.py` → none), so the `powershell -Command "...::Show('{message}', '{title}')"` fallback is the only path on every Windows install; a single quote breaks out; the tool is not in `TOOLS_REQUIRING_CONFIRMATION`; registered in every non-"chat" profile of the flagship; window hidden, output to `DEVNULL`. *Probe:* `message="hi'); Write-Host INJECTED; ('x"` renders to `...::Show('hi'); Write-Host INJECTED; ('x', 't')`. Attacker position: prompt-injected content steering a tool argument; no click. **Fix:** pass strings as arguments to a fixed script block (or `-EncodedCommand` with escaped literals), gate behind confirmation, add a quote-injection test. Confidence High. Tracked: none. Source 01.

**C3. PowerShell command injection via a document *filename* — no model, no confirmation** 🔒 — `src/gaia/rag/pptx_utils.py:313-336` (`convert_pptx_to_pdf`, reached from `rag/sdk.py:1048`) f-string-interpolates the absolute file path into a single-quoted PowerShell literal and runs `powershell -NoProfile -Command`; `_sanitize_stem` (`ui/routers/documents.py:123`) strips `<>:"/\|?*` but not `'`. A deck named `quarterly'; Start-Process calc; '.pptx` uploaded through the Agent UI documents endpoint executes on **indexing** — no tool call, no model decision, no modal. Same class as C2 with strictly fewer preconditions. **Fix:** pass paths as `-args` to a `param($in,$out)` script block or `-EncodedCommand`; reject `'` in `_sanitize_stem`; quote-in-filename test. Confidence High. Tracked: none. Source crit (found in a file the review had listed as unread).

**C4. Windows shell "read-only allowlist" is bypassable — arbitrary command execution via `cmd.exe`, and file writes through allowlisted `git`/`wmic`** 🔒 — `src/gaia/agents/tools/shell_tools.py:192-194` flags `&` only when followed by whitespace (`&(?=\s|$)`), and on Windows the validated *string* is handed to `cmd.exe` with `shell=True` (`:949-958, :1029`). The PowerShell filter (`:596-652`) blocks `-enc`/`-EncodedCommand` but not PowerShell's accepted prefix spellings `-e`/`-ec`; it inspects only `word-word` cmdlet tokens, so aliases (`sc`, `ri`, `saps`, `iwr`), `[System.IO.File]::WriteAllText(...)`, `[System.Diagnostics.Process]::Start(...)`, `(Get-WmiObject …).Create(...)`, `& calc.exe`, `&$var` and `>` inside `-Command` all pass as "read-only". *Probe (two reviewers):* `run_shell_command("dir . &where cmd")` → success, second command executed; validator allows `powershell -e …`, `-Command "Get-Content x > C:\out.txt"`, `"[System.Diagnostics.Process]::Start('calc')"`; `>&` also slips the regex but has no cmd.exe payload (handle duplication, not redirection); `<&` is correctly refused. Independently, the git allowlist checks only `cmd_parts[1]`, so `git log --output=<path> --format=<anything>` is a near-arbitrary-content, arbitrary-path file write, and `wmic /output:` writes too (`:569-592`; *probe:* real file written). Gate, stated honestly: `run_shell_command` **is** confirmation-gated, so an interactive TTY user sees the raw string and must approve — what fails is the allowlist's *claim* of read-only safety, and the gate is absent under `GAIA_AUTO_APPROVE_TOOLS`, `auto_approve_gated_tools`, a session "always" grant on `dir`, or a skill's `shell:execute:*` grant. **Fix (two steps):** (a) now — treat any `&` as an operator, reject any unique prefix of `EncodedCommand`/`File`/`ExecutionPolicy`, refuse `[Type]::`, `.Method(`, `&`/`.` invocation and `$` inside `-Command`, refuse `--output`/`-o`/`/output:`/`/append:` as already done for `sort -o`; regression tests f **C5. `shell:execute:gh` skill grant ALLOWs `gh auth status --show-token` / `-t`, printing the GitHub credential unprompted** 🔒 — `src/gaia/skills/binaries.py:414-415` (`"auth": _gh({"status"})`, empty deny-list) lands the call in the ALLOW tier that `skill_grant_covers_call` exempts from confirmation. *Probe:* `gh auth status --show-token → allow`, `gh auth token → refuse`. Any loaded skill with `shell:execute:gh` (or a prompt injection in one) can dump the PAT into tool output for a `network:read` skill to exfiltrate. **Fix:** `denied_flags={"-t","--show-token"}` on `auth`; allow-list flags for read-only subcommands as the `pytest` policy does; also refuse `--web`/`--watch`. Confidence High. Tracked: none. Source 01.

**C7. Fifteen file/RAG/vision tools read or write outside the `allowed_paths` sandbox — a sandbox that is on by default and that three docs call a production security control** 🔒 — the sandbox is not opt-in: `PathValidator.__init__` (`security.py:248-255`) and `ChatAgent.__init__` (`gaia_agent_chat/agent.py:253-256`) fall back to `Path.cwd()`, so every ChatAgent/GaiaAgent runs one. Six families bypass it: (a) `filesystem_tools.find_files(scope=<path>)` accepts any root (`_get_search_roots:1120-1156`, `scope="everywhere"` walks every drive) and never calls the mixin's own `_validate_path`; the docstring at `:52` claims "All path parameters are validated"; `tests/unit/test_filesystem_tools_mixin.py:656 test_scope_specific_path` asserts arbitrary-path scope as intended behaviour, so fixing this breaks that test. (b) `rag_tools.index_directory` (`:1954-2016`) never calls `_is_path_allowed`; the file's only two calls are in `index_document` (`:1259`) and `query_specific_file`'s auto-index (`:576`). (c) `RAGSDK.index_document` (`rag/sdk.py:2552`) contains no validator call at all — its first path touch is `_get_cache_path` (`:452-457`), whose `except (OSError, IOError)` swallows the `PermissionError` `_safe_open` raises and returns a `…_notfound.json` key; the PDF/PPTX/XLSX/DOCX extractors then hand raw paths to their libraries (`:722, 1012, 1601, 1737`); the tool-layer gates are `if hasattr(self, "_is_path_allowed")`, defined in exactly one place repo-wide (`gaia_agent_chat/agent.py:1161`), so any custom agent composing `RAGToolsMixin` (the documented pattern) has no check. *Probe (twice):* PDF outside `allowed_paths` → opened and paged (`EmptyPDFError`), TXT → "Access denied". (d) `vlm/mixin.py:139-159, 193-202` `analyze_image`/`answer_question_about_image` read any path (zero validator references in the file) and return the VLM's *description* — an exfiltration channel, not just a read. (e) Listing tools: `ChatAgent.list_files` (`:1359-1393`, bare `os.listdir`), and in **C8. A session's file allowlist silently expands to the whole directory an attached document sits in (`$HOME` included), reads have no sensitive-file denylist, and the write guard misses shell-rc / autostart / git-hook files** 🔒 — `src/gaia/ui/_chat_helpers.py:926-940` (`_compute_allowed_paths`) grants the **parent directory** of every attached document to a `prompt_profile="full"` agent with `read_file`/`write_file`/`edit_file` and shell tools; attach `C:\Users\alice\notes.txt` and the home tree is allowlisted for the turn. `PathValidator` applies no sensitive-file denylist on reads (`is_write_blocked` is reachable only from `validate_write`, `security.py:584`; `file_io_tools.py:54` gates reads on `is_path_allowed` alone), so `read_file("~/.ssh/id_rsa")` returns the key. On the write side, `security.py:29-52, 112-190, 495-560` cover `.env`, key material, `~/.ssh`, `LaunchAgents`, the Windows `Startup` folder — but not `~/.bashrc`/`.profile`/`.zshrc`/`.config/autostart/*.desktop`/`.gitconfig`/`.git/hooks/*`/PowerShell `profile.ps1`, and `_prompt_overwrite` (`security.py:622-640`) auto-approves overwrites when `_is_interactive()` is false, i.e. in the UI server context. A prompt-injected `write_file("~/.bashrc", "curl … | sh")` passes `validate_write`, shows a benign-looking modal (or none under auto-approve), and runs on the next shell — the cleanest injection → persistence chain in this report. A machine-global grant list compounds it (I13: `~/.gaia/cache/allowed_paths.json`, written by the CLI's `[a]lways`, is unioned into every validator incl. the UI's). **Fix:** grant the *files*, not their parents (`PathValidator` already matches exact paths); if a directory grant is needed, refuse `Path.home()`, drive roots and `BLOCKED_DIRECTORIES` ancestors; apply `SENSITIVE_FILE_NAMES`/`SENSITIVE_EXTENSIONS` to reads; add shell rc / profile / autostart / git-hook / PowerShell-profile names to the write blocklist; surface "this file runs on login" in the modal. Do this as t **C9. `fetch_webpage` / `open_url` (ChatAgent inline tools in the flagship's default `full` profile) bypass the SSRF/private-IP guard the browser mixin enforces** 🔒 — `gaia_agent_chat/agent.py:1521-1566, 1495-1518`: bare `httpx.get(url, follow_redirects=True)` with only a scheme check, while `BrowserToolsMixin.fetch_page` goes through `WebClient`, which refuses loopback/private/reserved IPs and re-checks after DNS resolution (`web/client.py:45-75, 327-365`). `http://127.0.0.1:13305/…`, the daemon loopback API, `169.254.169.254`, and public URLs that 302 to localhost all get through. Attacker position: indirect prompt injection from an indexed document or fetched page. **Fix:** route through `WebClient` or delete the duplicates (`fetch_page` is registered in the same profiles). Confidence High. Tracked: none. Source 01, crit.

**C10. The generic `AgentServer` REST API (the server hub packages are documented to use for `--api`) has no caller auth and Origin-reflecting credentialed CORS; the OpenAI-compatible API has no auth on chat completions** 🔒 — `src/gaia/agents/base/server.py:441-447` (`allow_origins=["*"], allow_credentials=True` — Starlette reflects the requesting Origin in that configuration; *probe* confirmed browsers do not reject it), `run_api` (`:664`) binds `localhost:8000`, `agent_provision` (`:595-625`, `POST /v1/<id>/init`) can start multi-GB pulls. The repo's own `gaia.sidecar.caller_auth` (used by the flagship sidecar) documents exactly this drive-by/DNS-rebinding threat; the base class other agents inherit gets none of it. Any web page can `fetch("http://localhost:8000/v1/chat/completions", …)` and drive `process_query` (non-gated tools run; gated ones are denied off-TTY). `src/gaia/api/openai_server.py` gets CORS **right** (`_cors_config():158-189` is loopback-only by default and its `*` branch is opt-in with credentials disabled — an earlier draft of this finding said otherwise and was refuted); its real gap is auth: `/v1/chat/completions` has none (only the `/v1/<agent>/*` relay checks `GAIA_API_KEY`), the docs' first example binds `0.0.0.0` (`api-server.mdx:24`), and `gaia api --help` offers `--host` with no auth flag. **Fix:** copy `openai_server._cors_config()` into `AgentServer.build_api_app` verbatim (removes the reflection in one reviewed change), then mount `HostOriginMiddleware` + a dependency built on `caller_auth.token_ok`/`is_exempt_path`; apply `require_api_key` to chat completions when `GAIA_API_KEY` is set and refuse non-loopback binds without a key; fix the doc example. Confidence High. Tracked: #2951 (names `server.py:442-446` exactly), #630 (API auth). Source 01, 03, crit.

**C11. Agent UI backend: 41 of 92 mutating routes are CSRF-able from any website — one body-less cross-origin POST publishes the user's Agent UI to the internet; no Host/Origin validation anywhere** 🔒 — the `X-Gaia-UI` preflight guard is defined **four times** (`routers/connectors.py:106`, `agents.py:58`, `hub.py:53`, `memory.py:41`) and applied to 24 route decorators; `memory.py` applies its own copy to 3 of ~20 routes. Of the 92 mutating routes (incl. the 14 `/v1/email/*` routes `server.py:638-640` mounts unconditionally), 41 take no Pydantic body and are reachable by a plain cross-origin form POST or query-only request: `POST /api/tunnel/start` and `/stop`, `POST /api/documents/upload` (multipart → indexed into the user's RAG = persistent prompt injection), `POST /api/files/upload`, `POST /api/documents/{id}/reindex`, `/cancel-indexing`, `POST /api/memory/prune?days=7` (deletes memory older than 7 days), `/consolidate`, `/rebuild-embeddings`, `/rebuild-fts`, `/reconcile`, `/refresh-system-context` (runs `store.delete_by_category("system")` and re-scans the host), `POST /api/sessions/{id}/activate`, `POST /api/mcp/agent-server/stop`, and the whole `/v1/email/*` surface (`send`, `draft`, `archive`, `quarantine`, `triage`, `confirm`, `init`, `search`…). Pydantic-JSON-body routes are protected only *incidentally* — FastAPI 422s a `text/plain` body (verified live) — which is not a security control: `mcp.start_agent_mcp_server` already takes `Optional[...] = None`, and DELETE/PUT/PATCH routes without the guard are protected only by the preflight non-simple methods require. *Live proof:* a body-less cross-origin `POST /api/tunnel/start` from a probe returned 200 **and started a real public ngrok tunnel** (killed immediately); a cross-origin form POST to a mirror of `prune_memory` returned `{"pruned":7}`. `grep TrustedHost|allowed_hosts src/gaia/ui src/gaia/daemon src/gaia/api` → none, so DNS rebinding also reaches the read side (`GET /api/files/preview?path=~/.ssh/id_rs **C12. The Agent UI backend trusts every `*.ngrok-free.app` and `*.use.devtunnels.ms` origin with credentials and `allow_headers=["*"]` — anyone can rent one, and it defeats the `X-Gaia-UI` guard C11 relies on** 🔒 — `src/gaia/ui/server.py:549-563` (`allow_origin_regex=r"https://[a-zA-Z0-9-]+\.(ngrok-free\.app|use\.devtunnels\.ms)"`, `allow_credentials=True`, `allow_headers=["*"]`). Those are shared self-service namespaces: an attacker's page on their own free subdomain is an origin this backend trusts, its preflight is approved *including `X-Gaia-UI`*, so it reaches the 24 guarded routes as well as the 41 unguarded ones and can **read** every response — `GET /api/files/preview?path=…` included. `TunnelAuthMiddleware` passes every request through when the tunnel is not active (`:123-125`), so there is no cookie to ride and no auth to defeat. *Probe (exact middleware config, starlette 1.6.0):* preflight from `https://attacker-owned.ngrok-free.app` → 200, `ACAO=<that origin>`, `ACAC=true`, `ACAH=x-gaia-ui,content-type`; read-back of `/api/files/preview` → 200; `https://x.ngrok-free.app.evil.com` → 400 (the regex is full-matched — that half is fine). The allowance is also dead config: the tunnel GAIA starts issues `*.ngrok-free.dev` (which the `.app` regex does not match), and the mobile flow serves the SPA *from* the tunnel origin, so its requests are same-origin and CORS never applies — the entry grants a capability to attackers and nothing to users. Browser Private-Network-Access enforcement is not a mitigation (not shipped consistently; Starlette emits no PNA header). An earlier draft cleared this in Appendix C on the grounds that ngrok domains are on the PSL — which protects the *cookie*, not the API. C11's middleware fix is insufficient without this. **Fix:** delete `allow_origin_regex` (nothing needs it); if a tunnel origin must be allowed, allow the one URL `TunnelManager` minted for this session; test that `https://someone-else.ngrok-free.app` gets a 400 prefli **C13. MCP bridge answers every origin with `Access-Control-Allow-Origin: *` and runs unauthenticated by default** 🔒 — `src/gaia/mcp/mcp_bridge.py:436-443, 453, 505`; `gaia mcp start` defaults to "Auth: none". *Probe (live):* `OPTIONS /chat` with `Origin: http://evil.example` → 200 + `ACAO: *`. A page can POST to `/chat` and **read** the reply, including the one shared `AgentSDK` conversation every caller uses (`:173-182`) and any RAG context. `tests/unit/test_mcp_bridge_auth.py:227` pins the open preflight as intended. `resolve_bind_host` (`:468-495`) keeps the bridge on loopback unless the user passes `0.0.0.0`, but loopback is not a mitigation here — the attacker is a page in the user's own browser reaching `http://localhost:<port>`, and `ACAO: *` is exactly what lets it read the answer. **Fix:** reflect only allow-listed origins (or none) when no token is configured; drop `ACAO: *` from data responses; per-client sessions; flip the test. Confidence High. Tracked: #2951 (adjacent), none for the bridge. Source 03.

**C14. Electron: unvalidated `shell.openExternal` + a renderer link allow-list that passes `/…` and `//host/…` — one click on an LLM-rendered link can launch a local binary or a UNC path** 🔒 — `src/gaia/apps/webui/main.cjs:515-518` (`setWindowOpenHandler(({url}) => { shell.openExternal(url); …})`, no scheme check, no `will-navigate` guard), window loaded from `file://` (`:569-571`); `src/utils/markdown.ts:52,56` lets root-relative/scheme-less URLs through; every markdown link is `target=_blank` (`MessageBubble.tsx:676-687`). `/Windows/System32/calc.exe` resolves to `file:///C:/Windows/System32/calc.exe` → ShellExecute; `//attacker/share/x.exe` (and the `\\host\share\x.exe` backslash form) → SMB fetch. *Verified:* `new URL('/Windows/System32/calc.exe', 'file:///C:/…/index.html')` returns exactly that on ada/WHATWG (Node 22), and `ShellExecuteW` on those URLs answers `SE_ERR_FILENOTFOUND` (it resolved them to paths), not `SE_ERR_NOASSOC`. Attacker position: prompt-injected model output plus one user click — not drive-by. This is the prompt-injection model #976's markdown hardening was written for. **Fix:** allow only `http:`/`https:`/`mailto:` in `main.cjs`, checked on the *resolved* URL Electron hands the handler (resolution is what turns `/x` into `file:///C:/x`); add `will-navigate` prevention; keep only `#` fragments for chat-content links. Confidence High (the one untested link is whether Electron 44's `openExternal` itself filters `file:` before `ShellExecuteW`). Tracked: none (#976 is the ancestor). Source 04, crit.

**C16. A chat turn can mint `system` / `profile` / `permission` memory rows that render at the top of every future system prompt — three write paths skip the category validator** 🔒 — `memory_store.py:105-118` states the invariant ("a chat turn must not be able to mint a permission grant, a system fact, or a profile entry") and `store()` (`:751-800`) validates nothing; only `seed_bulk` does. (a) The LLM extractor checks categories only on `add` ops; an `update` op with `category: "profile"`/`"system"` is written as-is (`memory.py:1442-1443, 1514-1516`). (b) The `remember` tool's `VALID_CATEGORIES` (`:2550`) admits `system`/`profile`/`permission` while its docstring lists six. (c) `ui/routers/memory.py:1557, 1584` (`commit-discovery`/`commit-inference`) pass `item.get("category","profile")` straight to `store()`; the module header claims all validation sites are "in sync automatically". `_build_stable_memory_prompt` renders these rows first in every later prompt — persistent prompt injection and, via `permission`, self-granted autonomous-mode approval; reachable from indirect injection in an indexed document. **Fix:** validate categories in `MemoryStore.store()`/`update()` (reject privileged ones unless the caller is `seed_bulk`/admin); align `remember`; route the two routers through `KnowledgeCreate`. Confidence High. Tracked: none. Source 01, crit.

**C17. `PUT /api/connectors/{id}/grants/{agent_id}` writes the authorization ledger with no scope ceiling and no existence checks** 🔒 — `ui/routers/connectors.py:962` (`put_grant`) → `connectors/grants.py:155` (`grant_agent`): no `REGISTRY.get(connector_id)`, no agent check, no check that requested scopes ⊆ `spec.available_scopes`. `PUT /api/connectors/google/grants/installed:email` with `{"scopes":["https://www.googleapis.com/auth/drive","https://mail.google.com/"]}` makes `check_agent_grant` return True for Drive/full-mailbox calls the connector never advertised; a typo'd connector id returns 200 and persists a phantom key. The same file's other grant path documents this hazard as something it prevents (`:298-306` — out-of-ceiling scope → 400 `scope_not_allowed`), and `put_activation` two routes down does call `_require_mcp_server`. This is the other half of C1: fixing C1 makes the boundary real and then lets any local caller (or a CSRF'd browser, though this route is PUT and therefore preflighted) move it. **Fix:** resolve the spec first (404 on `KeyError`), reject out-of-ceiling scopes with the existing 400 shape, push both checks into `grants.grant_agent`. Confidence High. Tracked: none. Source crit.

### 2.2 Data loss and wrong-answer bugs

**C22. `gaia skill remove .` deletes all of `~/.gaia/skills` (signing keys, trust store, lock); `..` deletes `~/.gaia`** — `src/gaia/skills/install.py:487-529` (`remove_skill`: `target = root / name` … `shutil.rmtree(target)`) does no name validation; the same unvalidated join is in `install_skill` (`:187`, `rmtree` at `:271`) and `gaia skill import --name … --force` (`src/gaia/skills/cli.py:580-598`: `:588` `target = destination_root / name`, `:596` `rmtree` under `--force`), where the fallback name comes from the imported bundle's own `SKILL.md` — i.e. remote-supplied. `pathlib` collapses `root / "."` to the root, leaves `root / ".."` at its parent, and an absolute name replaces the root; `is_dir()` is true for all of them. *Probe:* temp HOME → `remove_skill('.')` removed the skills root incl. `keys/`; `remove('..')` → `config.json` gone; exit 0, "✅ Removed skill". Attacker position: none — a mistyped or copy-pasted name; the model-facing wrapper (`skill_library_tools._reject_bad_name`, whose docstring says the substrate gap was "reported upstream" — no issue exists) already rejects, so this is a CLI footgun, not a reachable attack, kept 🔴 on the data-loss axis like C23. **Fix:** one `_validated_skill_name()` (`format.NAME_PATTERN`) used by remove/install/import/migrate, applied to both `args.name` and the bundle's `skill.name`, plus a `target.resolve().parent == root.resolve()` assert before `rmtree` (the load-bearing half — it catches symlink and `\\?\` shapes the pattern never sees); tests for `.`, `..`, `../x`, absolute. Confidence High. Tracked: none. Source 01, crit.

**C23. `GAIA_HOME` pointed at the user's home turns `gaia uninstall --purge` into deletion of `~/Documents` and `~/venv`** — `src/gaia/installer/uninstall_command.py:93-95` (`_gaia_home` honours `GAIA_HOME`), `:154-164` (`_purge_paths`), `:166-178` (`_safe_roots` = the GAIA home itself), `:445-473` (containment guard). `GAIA_HOME` is honoured as the state root elsewhere (`security.py:89`, `lemonade_embedded.py:144`); the purge list becomes `$HOME/venv`, `$HOME/documents` (case-insensitive on Windows/APFS → real `Documents`), and the containment guard is vacuous because the allowed root *is* `$HOME`. *Probe (twice):* fake home with a real `Documents/thesis.docx` → plan lists `…\fakehome\documents exists=True`, resolves to `Documents`, `inside_safe_roots=True`. Attacker position: none — user misconfiguration. **Fix:** refuse a plan whose resolved root equals/contains `Path.home()`, a drive root or `/`; require a GAIA marker (`config.json`); print the resolved root in the prompt. Confidence High (Medium on prevalence). Tracked: none. Source 02.

**C24. `gaia kill --port N` / `gaia api stop` / `gaia kill --lemonade` can kill unrelated processes** — `cli.py:4441-4456` matches `f":{port}" in line` over every *whole* `netstat -ano` line — no LISTENING filter, no anchoring (`":80"` substring-matches `:8009` and ~150 other rows on the review machine; foreign-address and TIME_WAIT rows count) — and returns after the first kill, so Windows kills exactly one wrong process. Unix `lsof -ti:PORT` + `kill -9` (`:4470-4483`) lists both ends of every connection and kills every pid returned (the Agent UI backend, daemon, and any `gaia chat` connected to Lemonade); the Unix `netstat -tulpn` fallback (`:4501-4525`) has the same unanchored match. `.decode()` is strict UTF-8 on OEM-codepage output, so on non-English Windows `gaia api stop` exits 1 with a generic "Error killing process on port N: 'utf-8' codec can't decode…" (caught at `:4539-4543`) instead of a port-not-found result. **Fix:** parse columns, require `LISTENING` + exact local port (Windows and the Unix fallback); `lsof -nP -iTCP:{port} -sTCP:LISTEN -t`; require the process name to match a GAIA/Lemonade allowlist before killing (as `lemonade_embedded._daemon_alive` does); `errors="replace"`. Confidence High. Tracked: #789 (CLOSED — the same substring bug was reported and closed earlier). Source 02.

**C25. `replace_function` silently deletes code between the target and the next `def`/`class`** — `src/gaia/agents/tools/file_io_tools.py:1054-1067` scans for the next same-indent `def/class`, so module constants and the next function's decorators are inside the replaced span and dropped, reporting `success`. *Probe:* `CONSTANT = 42` and `@decorator` between `foo` and `bar` vanished. Two more defects in the same routine: because `start_line` is the `def` line, the target's *own* decorators are left behind and silently re-applied to the replacement (a semantic change), and `ast.walk` (`:1038-1042`) takes the *first* function of that name anywhere in the module, so `replace_function("run")` on a file with a nested or method-level `run` rewrites the wrong one. Backup only when a `PathValidator` is attached. **Fix:** AST spans (`end_lineno`, `decorator_list[0].lineno`), top-level-only lookup or a qualified name. Confidence High. Tracked: none. Source 01.

**C29. Two renderer "cleaners" delete or mangle legitimate answer content in normal use** — `src/gaia/apps/webui/src/components/MessageBubble.tsx:130-194` (`cleanLLMJsonBlocks`) drops any `{…}` whose first 50 characters contain the exact key `"tool"`, `"thought"` or `"answer"`, and drops *everything after* an unbalanced `{` (a code snippet, a shell one-liner) — applied to every assistant message *and to the user's own bubbles*, so a pasted tool schema is mangled; `:225-240` (`stripBogusCodeFences`) unwraps any fence whose tag is not in a hand-maintained list, so ```` ```shell ````, `console`, `cmd`, `bat`, `jsonc`, `mermaid`, `env`, `http`, `hcl`, `latex` blocks render as Markdown prose (a `# comment` becomes an H1, `* glob` a bullet, `<tag>` disappears). Copy still copies the raw text, so transcript and rendering disagree. Fires on any answer containing a shell block or a JSON example. **Fix:** strip only blocks that parse as a complete tool-call envelope; never truncate on an unbalanced brace once streaming has finished; invert the fence rule (strip only 1–2-char unknown tags, the Qwen-Coder ```` ```i ```` case); rely on the server-side filter as the primary path. Confidence High. Tracked: none. Source 04, crit.

### 2.3 Product-breaking behaviour in normal use

**C30. TUI: Esc/Ctrl+C does NOT stop the released `gaia-agent` binary — the cancelled turn (and the user's next message) keeps running, then the TUI errors with "file already closed"** — `tui/internal/client/subprocess.go:222-228, 263, 135-140, 505-509`. The released agent is a PyInstaller *one-file* binary (`--onefile` at `release_agent_gaia.yml:412`): `Process.Kill()` kills the bootloader parent only; the Python child keeps both pipe ends. *Verified twice on this machine* against the installed `gaia-agent.exe`: after `Kill()` a child with `ParentProcessId == killed pid` stays alive and stdout blocks (no EOF for 8 s) until stdin is closed. Consequences traced in code: the reader goroutine stays parked in `Scan()`, `s.started` stays true, the next Enter writes into the orphan's stdin (queued behind the "cancelled" turn, which runs to completion incl. tool calls — `stdio.py:661-672, 683`), the orphan's first event wakes the old reader → `resetDeadChild` → pipes closed under the second turn's reader (two goroutines on one `bufio.Scanner`) → `agent stdout read error: read |0: file already closed`. Scenario: user presses Esc on "delete all *.tmp under ~/proj" — the deletion still happens. The Go test double (`tui/test/mockagent`) is single-process, so no test can observe this. **Fix:** cooperative cancel over the control channel (`gaia_control: cancel`; `state.cancel_active()` exists) + kill the whole tree (Job Object / `Setpgid`) or ship `--onedir`; refuse to reuse a client whose previous turn has not reaped; add a mock agent that spawns a pipe-holding grandchild. Confidence High. Tracked: none (#2474 is the daemon's sidecar reaping; #2917 adjacent). Source 04.

**C31. TUI: cancelling a turn respawns the agent from its ORIGINAL launch flags — `/bypass off` is silently undone (banner gone) and loaded skills / "always" grants / `/model` switch are lost** 🔒 — `subprocess.go:238-246, 145` (`exec.Command(s.path, s.args...)`), `bypass.go:89-126` (`setBypass` only sends a control line and flips the local flag), `:143-154` (`applyLaunchBypass`, the once-only launch reflection), `canonical.go:39-74` (the model-state ping re-syncs the model, not bypass), `stdio.py:1132` (`PermissionState(bypass=args.bypass_permissions)` — grants and loaded skills live in the same in-process state). `gaia-tui --bypass-permissions` → `/bypass off` → Esc → "clean up the build dir" → `rm -rf …` with no prompt and no banner. `model.go:283-289` already documents the revert for `/model` and prints a warning; bypass does not. **Timing caveat (gated on C30):** on a source or `--onedir` install the revert is immediate; on the shipped one-file binary the next message goes to the surviving orphan (which still has bypass off), and the revert lands one message later — a maintainer reproducing on the release build must send two messages after Esc. The same respawn also drops the agent's verbatim prompt window (the last 12 exchange pairs: `conversation_history` lives only in the child, `stdio.py:737-771`; the host-owned transcript — `TranscriptResetter`, `client.go:32-37`, implemented only by `sse.go:793,856`, called at `chat/model.go:1298-1300` — exists only for the SSE transport; `MemoryMixin` still records turns to SQLite, so the loss is back-reference resolution, not data). **Fix:** re-send permission state + grants after any respawn, or carry `bypass` in the ping and warn/resync like the model revert; host-owned transcript replayed on respawn. Confidence High. Tracked: none. Source 04, crit.

**C32. Web fetch cannot open most CDN-fronted HTTPS sites — the IP-pinning adapter sends no SNI** — `src/gaia/web/client.py:203-230` rewrites the host to the resolved IP (hostname into URL userinfo, which urllib3 never uses for SNI). The docstring at `client.py:125-139` already acknowledges the missing SNI as a "residual limitation… intentionally out of scope" — this finding is the measurement of that limitation: it is most of the web. *Probe (live, three runs by two reviewers):* 8 of 14, then 9 of 11 hosts fail through `WebClient` and succeed with plain `requests` — `example.com`, `amd-gaia.ai` (handshake failure), `github.com`, `pypi.org` (cert for `*.python.org`), `stackoverflow.com`, `huggingface.co`, `arxiv.org` (cert for `sni-…default.ssl.fastly.net`), `lemonade-server.ai`, `www.amd.com` (timeout); `en.wikipedia.org` works. Callers: `fetch_page`, `download_file`, ChatAgent web tools, `rss-digest` skill, the DDG search fallback. `gaia hub install` / `gaia skill install` use plain `requests` and are unaffected. "Summarise https://github.com/amd/gaia" returns an SSL error. **Fix:** keep the pin, fix SNI via `get_connection_with_tls_context` / `connection_from_host(pinned_ip, …, pool_kwargs={"server_hostname": host, "assert_hostname": host})`; add a skip-if-offline live test against 3–4 CDN hosts. Confidence High. Tracked: none open (#1207 closed was the same symptom). Source 08, crit.

**C33. `gaia talk` keeps the microphone live while it speaks — on laptop speakers it can transcribe its own reply as the next user turn** — `talk/sdk.py:258-262` → `audio_client.py:345-365 speak_text` starts TTS with no `status_callback`, never calls `whisper_asr.pause_recording()`, and joins the TTS thread with `timeout=5.0` then returns, so transcription resumes while TTS is still playing and the next reply opens a second `sd.OutputStream`. The correct pausing pipeline (`process_voice_input`, `:170-237`) exists and is never called by the CLI. The 5-second join is an independent second defect: even with pausing wired, a reply longer than 5 s would resume the mic mid-sentence. **Fix:** pause before `tts_thread.start()`, full `join()` (wait for the `__END__` sentinel), drain the transcription queue, then resume; collapse the two pipelines. Confidence High (mechanism; the audible loop depends on room/speaker level). Tracked: none (#2985/#702 adjacent). Source 08.

**C34. `gaia talk` accepts `--model`, `--max-tokens`, `--use-claude`, `--use-chatgpt`, `--claude-model`, `--base-url` and `--stats` and then runs without them (#124 still reproduces)** — `cli.py:759-775` builds `TalkConfig` from audio flags only; `show_stats=kwargs.get("stats", False)` reads a key argparse never produces (`dest="show_stats"`, `:1242-1245`); `--model` and `--base-url` *are* honoured for the Lemonade pre-flight (`:513-531`) and then dropped, so the wrong model is checked/loaded and the default used for the conversation; `TalkConfig` has no `base_url`/`claude_model` field at all. All documented in `cli.mdx:962-972` and `guides/talk.mdx`. *Probe:* `parse_args(["talk","--stats"])` → `show_stats=True`, `stats` absent. The same "accepted and dropped" pattern: `gaia prompt --device/--use-claude/--claude-model` (never reach `GaiaCliClient`, which hard-codes Lemonade; `--use-claude` also skips the preflight), `gaia eval agent --device` (dead because `--model` defaults to `claude-opus-5`, so `if eval_device and not eval_model` never fires — fix is `default=None`), `gaia mcp start --ctx-size` (never read), `gaia telegram start --health-port` (read only by `status`; the server hard-codes 8765) and `gaia telegram stop --force` (never read). **Fix:** wire the flags or reject them; a CLI test that monkeypatches `TalkSDK` and asserts the `TalkConfig` built from `gaia talk --model X --stats --max-tokens 9`. Confidence High. Tracked: #124 (open since v0.13; the other flags are not listed there). Source 02, 03, 08.

**C35. Electron: `NotificationService` calls `TrayManager.setNotificationCount`, which does not exist — badge never updates, and the agent crash-limit path throws inside an EventEmitter listener → `process.exit(1)`** — `services/notification-service.cjs:319-323` (called from `:149,170,179`); `grep setNotificationCount src/` → only the caller and the Jest mock (`tests/electron/test_notification_service.js:78`). Normal path: `TypeError` caught and logged as "Non-JSON stdout"; crash-limit path (`agent-process-manager.cjs:826` emit inside the child `exit` handler) → `uncaughtException` → `main-safety-net.cjs:115` `process.exit(1)` → backend + sidecars orphaned (no `will-quit`). **Fix:** implement the method, wrap listener invocations, test against the real `TrayManager`. Confidence High on the missing method (verified); the crash-to-`process.exit` path is traced, not reproduced. Tracked: none. Source 04.

**C36. Electron: cold-start `gaia://hub/install/<id>` deep links are dispatched before the backend listens, so "Open in GAIA" from the website fails whenever GAIA was closed** — `main.cjs:1007` starts the backend, `:1034` processes startup deep links (→ `fetchCatalogEntry` HTTP → `ECONNREFUSED` → fail-closed "Could not verify this agent"), `:1046` `waitForBackend` only after `loadApp`. Only the already-running (`second-instance`) path works. **Fix:** dispatch after `waitForBackend()` resolves. Confidence High. Tracked: none. Source 04.

**C37. The Agent UI can block a chat turn forever on an `input()` prompt printed to the *server's* terminal** — `_chat_helpers.py:494, 1918` build streaming agents with `silent_mode=False` in a daemon thread; two sinks call `input()` whenever `sys.stdin.isatty()`: `security.py:462 _prompt_user_for_access` (reached by any read outside the allowlist — `is_path_allowed(path)` defaults `prompt_user=True`; likely, given C8's narrow-then-wide allowlist) and the max-steps prompt `agent.py:6455-6489`. Both are true for the documented dev launch (`uv run python -m gaia.ui.server --debug`) and for `gaia chat --ui` from a terminal (the Electron shell pipes stdin and is unaffected). The browser gets keepalives for 600 s then "Response timed out"; the producer thread stays blocked on the server's stdin forever and swallows the operator's next keystroke. **Fix:** pass `prompt_user=False` on every UI-driven validator call and gate the max-steps prompt on console type — the *server* having a TTY says nothing about the requester; the UI already owns an interactive channel (`permission_request` / `/api/chat/confirm-tool`). Confidence High (the block is certain once reached; reachability needs a terminal-launched server). Tracked: none. Source 01, crit.

**C38. `import gaia` dies at import when the home directory cannot be resolved** — `src/gaia/logger.py:50` `Path.home()` (reached from module scope at `:281`); the `except (PermissionError, OSError)` below does not catch the `RuntimeError` Python raises when `USERPROFILE`/`HOMEDRIVE+HOMEPATH` are unset. Any Windows process launched with a curated environment — a scheduled task, a service wrapper, a CI `env:` block, another tool's `subprocess.run(env=...)` — cannot import the package at all; `tests/unit/test_cli_refusal_exit_codes.py` (env with `HOME` but no `USERPROFILE`) is the in-repo proof and fails 4 tests on Windows. POSIX falls back to `pwd` and is unaffected. **Fix:** catch `RuntimeError` and fall through to the tempdir fallback that already exists at `:118-140`. Confidence High. Tracked: none. Source 02, crit.

### 2.4 Release and quality gates

### 3.1 Agent framework, tools, memory, skills

- **I2. `AgentSDK.send()` sends the system prompt twice and `update_config(system_prompt=…)` leaves the old one in place** — `chat/sdk.py:100-110, 518-539`; provider prepends `_system_prompt` and `send()` embeds it again in hand-rolled `<start_of_turn>system` tokens. *Probe:* `count of SYS-ONE across request: 2`. Fix: structured messages via `llm_client.chat`.

### 3.13 Hub Worker, website router, website, install scripts

- **I90. Catalog writes are unconditional read-modify-write** — `workers/agent-hub/src/storage.ts:211-225`, `publish.ts:338, 470-474`, `catalog.ts:379-429 rebuildIndex`: no `onlyIf: { etagMatches }`, no serialisation. `release_components.yml` runs the `terminal-hub` and `agent-ui` publish jobs in parallel; an interleaving loses an entry from `index.json` (recoverable via `POST /reindex`, `index.ts:62-83`).
- **I91. Inline publish is not atomic** — artifact `put` first, then up to 8 doc objects, the manifest, and a ~40-call index rebuild (`publish.ts:361-474`, same shape in `skill-publish.ts`); any failure after the artifact `put` returns 500 but leaves the object; on retry `publish_to_r2.py:372-397` reconciles the 409 by byte-comparing the stored object, reports `OK 409 … identical bytes`, and the job goes green with the binary missing from `manifest.json`/`index.json` and from `gaia agent install`; recovery is manual R2 deletion.
- **I92. Artifact filenames can collide with the per-version doc objects** — `multipart.ts:20 ARTIFACT_FILENAME_RE` (enforced at `publish.ts:313` / `skill-publish.ts:110`) forbids only separators, so `gaia-agent.yaml`, `README.md`, `SKILL.md`, `package-files.json`, `audit.json` pass and are overwritten by the doc writes that follow (`publish.ts:413`); the catalog records the artifact's original SHA-256, so installers download the YAML and abort on checksum mismatch. Authenticated publishers only — a foot-gun that breaks the "server-side SHA-256 you can trust" guarantee.
- **I93. Both published schemas are stale.** `manifest.schema.json` has `language` enum `["python","cpp"]` and no `type` property under `additionalProperties: false`, so three of the four live manifests fail it (`terminal-hub`, `agent-ui`, `gaia`); `index.schema.json`'s `skill_metadata.audit` lacks the `attestation`/`cleared_tiers`/`content_digest`/`manifest_digest` the Worker emits, so it will reject every skill entry the moment the first skill is published (live `index.json` validates today only because none has); the conformance test diffs top-level keys only; the README calls both "the contract the website Hub pages build from".
- **I94. The install one-liners are served by an out-of-repo Cloudflare redirect to GitHub `main`** — `curl -I https://amd-gaia.ai/install.sh` → 302 to `raw.githubusercontent.com/amd/gaia/main/installer/scripts/install.sh`; `website-router/src/index.js` has no such rule and both READMEs say every non-`/docs` path is proxied to the Astro site. Users always execute whatever is on `main` at that second (no tag pinning, no rollback), and the rule is invisible to whoever rotates the zone — it has already 404'd once (#778, closed). The trust boundary is the project's own repo over HTTPS, so this is release-integrity hygiene rather than a third-party supply-chain hole; the genuine third-party link is the unpinned `astral.sh/uv` fetch in both scripts (I67). Tracked: #778.
- **I95. website-router's documented HTML edge cache is not happening in production** — README promises 60 s HTML / 1-year asset TTLs; live every HTML request is `cf-cache-status: DYNAMIC` and the origin sends no `Cache-Control` at all (only `etag` + `vary`), so assets get the zone's default 4 h Browser Cache TTL rather than the Worker's `ASSET_CACHE_TTL` (*probe*). Every page view round-trips to Railway.
- **I96. The flagship's live hub page tells visitors to `pip install gaia-agent-gaia`, which does not exist** — `website/src/data/catalog.ts:548-555` adds a "pip" tab for any `type: agent` with `language: python` and no `npm_package`; the flagship is published only as frozen binaries and *no* Python agent wheel is published at all (`publish_agents.yml` is `if: false` pending #1179). *Probe (live):* the page carries `pip install gaia-agent-gaia`; PyPI → 404. The primary CTA (`gaia agent install gaia`) is correct, so the impact is one tab of three, failing loudly. The same `installMethods()` was fixed twice for the mirror case (#3147/#2969) without adding the artifact-kind gate that would cover both. Fix: publish the wheels or stop advertising pip; gate the tab on an `artifact_kinds` field. Tracked: #3101 (same root cause), #1179.

## 6. CI/CD and release assessment

**What is good.** `publish.yml`'s core flow is sound: tag must be on `main`, `version.py` == webui `package.json` == tag, PyPI/npm via OIDC trusted publishing, a single `publish` environment approval, post-publish `pip install amd-gaia==<tag>` smoke, Sigstore on dists, reproducible TUI builds with `SHA256SUMS`; the v0.23.0 run went green end-to-end. `pypi.yml` builds on every PR with a negative test for the wheel verifier. Script-injection sweep is clean (no `github.event.*` text in `run:`); `claude-code-action` is SHA-pinned; eval workflows gate the key-bearing path on same-repo PRs; `lint.yml` chains the `util/check_*` scripts.

**What is structurally wrong.**

1. **Release gates run only at tag time** (C39): the release PR merged in an untaggable state because the navbar/notes validators live in `publish.yml`, not in any PR check; `update-release-branch.yml` and `release_components.yml` fire on the tag independently of validation/approval; the gate that *is* required (`email-eval`) is red on billing.
2. **Required checks are unknowable**: `rules/branches/main` is empty, the only ruleset is disabled, classic protection is not visible to the token. Every "gate" in this report is "gate if required".
3. **The eval gate has never produced a scorecard** (`test_eval_agent_gemma_consolidation.yml`: 10 skipped / 4 failed / 0 green in 15 runs; #3016/#2960), `test_eval_rag.yml` is disabled, `email_scorecard_refresh` last ran 2026-07-16. The CLAUDE.md eval rule is enforced by honour only, and `find_scenarios` overrides make a clean scorecard fakeable (I78).
4. **Supply chain** (C21, I23, I67, I94, I81): mutable action tags in the publish/sign path; unpinned Lemonade MSI baked into signed installers; `irm | iex` bootstraps in two shipped paths; install one-liners served from `main` by an out-of-repo rule; Dependabot blind to the Go TUI, npm sidecars, website and Worker.
5. **Untrusted code on persistent self-hosted runners** (C20) and **community-triggered Claude with `Bash` + `contents: write`**, an accepted risk whose bound is unverifiable from outside (I97).
6. **Silent fallbacks in the one workflow that ships** (C40, I79, I80).
7. **Noise that hides signal**: ~70 % of run records on `main` are fire-and-skip; dead/racing workflows; 95 registered vs 72 files; five workflows without a `permissions:` block (I82).

**What is good.** `docs.json` is complete (195 nav pages exist, no broken relative links/images); the `amd-gaia.ai/docs/` URL rule holds everywhere; CLAUDE.md's `KNOWN_TOOLS` table, default model, ctx sizes and `DEFAULT_MAX_STEPS` match code; every `ChatAgentConfig`/`AgentConfig`/`GaiaAgentConfig` kwarg in docs is real; the 13 starter skills conform to the skill format and their `tools_required` all resolve; the gaia and email npm doc bundles (README/SPEC/SKILL) are internally consistent and match `server.py` — the #1841 miss has not recurred; `README.md:131-151` carries a real release-process table.

    el.insertBefore(pill,s); s.textContent=s.textContent.replace(/^[CI]\d+\.\s*/,'');
    el.id=m[1]+m[2];
  });

  a.querySelectorAll('h2,h3').forEach(function(h){
    var id=h.textContent.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    if(used[id]){id+='-'+(++used[id]);}else{used[id]=1;}
    h.id=id; var l=document.createElement('a'); l.href='#'+id; l.textContent=h.textContent.replace(/^Appendix /,'App. ');
    if(h.tagName==='H3') l.className='l3'; toc.appendChild(l);
  });
  var counts={crit:(src.match(/^\*\*C\d+\./gm)||[]).length, imp:(src.match(/^- \*\*I\d+\./gm)||[]).length};
  var st=document.getElementById('stats');

    var d=document.createElement('div'); d.className='stat '+x[0]; d.innerHTML='<div class="n">'+x[1]+'</div><div class="l">'+x[2]+'</div>'; st.appendChild(d);
  });

  nodes.forEach(function(n){var frag=document.createDocumentFragment(); var re=/\b([CI])(\d{1,2})\b/g; var last=0,m,s=n.nodeValue;
    while((m=re.exec(s))){ if(!document.getElementById(m[1]+m[2])) continue; frag.appendChild(document.createTextNode(s.slice(last,m.index))); var l=document.createElement('a'); l.href='#'+m[1]+m[2]; l.textContent=m[0]; frag.appendChild(l); last=m.index+m[0].length; }
    if(last===0) return; frag.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(frag,n);});
})();
