name: Test MCPAgent and AgentMCPServer

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - 'src/gaia/agents/base/mcp_agent.py'
      - 'src/gaia/mcp/**'
      - 'tests/mcp/**'
      - 'setup.py'
      - '.github/workflows/test_agent_mcp_server.yml'
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/gaia/version.py'
      - '.github/actions/install-lemonade/**'
      - 'src/gaia/agents/base/mcp_agent.py'
      - 'src/gaia/mcp/**'
      - 'tests/mcp/**'
      - 'setup.py'
      - '.github/workflows/test_agent_mcp_server.yml'
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-mcp-agent:
    name: Test MCPAgent (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false || contains(github.event.pull_request.labels.*.name, 'ready_for_ci')

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false  # Continue testing other platforms even if one fails

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30  # Prevent hanging tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install uv (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          echo "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Install dependencies
        run: |
          uv pip install --system -e .[dev]
          uv pip install --system "fastmcp>=0.1.0"

      - name: Run MCPAgent tests
        run: |
          python -m pytest tests/mcp/test_agent_mcp_server.py -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            .pytest_cache/
            **/.coverage
          retention-days: 7

  test-summary:
    name: Test Summary
    needs: test-mcp-agent
    runs-on: ubuntu-latest
    # Run always except when workflow or dependency is cancelled
    if: >-
      ${{ always() && !cancelled() &&
          needs.test-mcp-agent.result != 'cancelled' }}
    permissions: {}

    steps:
      - name: Check test results
        run: |
          echo "MCPAgent tests completed"
          echo "Check individual job results for details"
